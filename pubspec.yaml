name: furnexa
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  collection: ^1.18.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  win32: ^5.15.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  path: ^1.9.1
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.4.0+3
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^8.1.7
  shared_preferences: ^2.5.3

  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  sqlite3: ^3.5.2
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo.png
    - assets/icons/furnexa_icon_1024_master.png
    - assets/icons/furnexa_icon_transparent.png
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
